spring.application.name=payment-processing
spring.profiles.default=mock
spring.profiles.group.mock=mock-ledger
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

payment.retry.defaults.max-attempts=3
payment.retry.defaults.attempt-timeout=1s
payment.retry.defaults.max-elapsed-time=5s
payment.retry.defaults.initial-delay=100ms
payment.retry.defaults.multiplier=2
payment.retry.defaults.max-delay=1s
payment.retry.defaults.jitter=FULL
payment.retry.policies.authorization.max-elapsed-time=4s
payment.retry.policies.capture-ledger.max-elapsed-time=3s
